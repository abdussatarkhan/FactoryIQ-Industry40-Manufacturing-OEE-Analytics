[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factoryiq_industry40_manufacturing_oee_analytics"
version = "1.0.0"
description = "Smart Manufacturing & Industry 4.0 Data Warehouse: Overall Equipment Effectiveness (OEE = Availability × Performance × Quality), MTBF failure analysis, and sensor anomaly detection."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
